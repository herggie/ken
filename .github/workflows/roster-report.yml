name: roster-report

# Pushes the full weekly report (lineup + byes + waivers + IR) to your phone
# every Sunday morning, plus on demand. Uses the same secrets as roster-health.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 13 * * 0"     # ~09:00 ET Sunday — before the early games

concurrency:
  group: roster-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roster-health
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: roster-health/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Push weekly report
        env:
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_TEAM_ID: ${{ secrets.ESPN_TEAM_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python report.py --config config.yaml --push -v
