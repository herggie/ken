name: trade-check

# Run a trade fact-check in the cloud (no PC needed) and push the result to
# your phone. Trigger from the GitHub app or web: Actions -> trade-check ->
# Run workflow, then type the players for each side.

on:
  workflow_dispatch:
    inputs:
      give:
        description: "Players you'd GIVE (comma-separated)"
        required: false
        default: ""
      get:
        description: "Players you'd GET (comma-separated)"
        required: false
        default: ""
      give_faab:
        description: "FAAB/$ you'd GIVE"
        required: false
        default: "0"
      get_faab:
        description: "FAAB/$ you'd GET"
        required: false
        default: "0"
      give_picks:
        description: "Draft picks you'd GIVE (e.g. 2027 1st, 2027 3rd)"
        required: false
        default: ""
      get_picks:
        description: "Draft picks you'd GET"
        required: false
        default: ""

jobs:
  trade:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roster-health
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: roster-health/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run trade check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: >
          python trade.py
          --give "${{ inputs.give }}" --get "${{ inputs.get }}"
          --give-faab "${{ inputs.give_faab }}" --get-faab "${{ inputs.get_faab }}"
          --give-picks "${{ inputs.give_picks }}" --get-picks "${{ inputs.get_picks }}"
          --push -v
