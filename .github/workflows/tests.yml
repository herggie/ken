name: tests

# Runs the offline unit tests (no ESPN/Sleeper network needed) on every push
# and PR. Chiefly guards the league-true projection scoring math in
# sources/espn_fantasy.py, which can't be exercised against live ESPN in CI.

on:
  push:
    paths:
      - "roster-health/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "roster-health/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roster-health
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: roster-health/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: python -m pytest tests/ -v
