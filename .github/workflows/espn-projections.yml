name: espn-projections

# Computes LEAGUE-TRUE projections straight from the ESPN Fantasy API using
# YOUR league's scoring rulebook, and pushes a compare of ours-vs-ESPN to your
# phone. This is the numbers-you-can-trust view: it follows your league's exact
# scoring, not the generic espn.com stats. Runs on demand, and every Sunday
# after the report so you can eyeball any skew before lineups lock.

on:
  workflow_dispatch:
    inputs:
      week:
        description: "Scoring period / NFL week (blank = current)"
        required: false
        default: ""
  schedule:
    - cron: "30 13 * * 0"     # ~09:30 ET Sunday, just after roster-report

concurrency:
  group: espn-projections
  cancel-in-progress: false

jobs:
  projections:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roster-health
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: roster-health/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Push league-true projections
        env:
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_TEAM_ID: ${{ secrets.ESPN_TEAM_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          python -m sources.espn_fantasy --config config.yaml --push -v \
            ${{ github.event.inputs.week && format('--week {0}', github.event.inputs.week) || '' }}
