# Roster Health Monitor — working config (TRACKED in git).
#
# Holds ONLY the roster + non-secret settings. Cookies/tokens come from env:
#   ESPN_SWID, ESPN_S2, ESPN_LEAGUE_ID, ESPN_TEAM_ID
#   NTFY_TOKEN / PUSHOVER_* / DISCORD_WEBHOOK_URL / SLACK_WEBHOOK_URL
# NEVER paste secrets here. Edit the roster weekly for waivers/trades and commit.

espn:
  league_id: 400979538   # from your league URL — not secret
  team_id: 14            # your team in that league — not secret
  year: 2026
  # SWID / espn_s2 cookies are NOT here — set them via ESPN_SWID / ESPN_S2 env
  # (local .env) or GitHub Actions secrets. They activate the live roster pull.

# slot: QB | RB | WR | TE | FLEX | DST | K | BENCH | IR
# Add player_id_espn to any row to skip fuzzy name matching.
roster:
  - { name: "Jayden Daniels",        team: WSH, position: QB,  slot: QB }
  - { name: "Saquon Barkley",        team: PHI, position: RB,  slot: RB }
  - { name: "Brian Robinson Jr.",    team: WSH, position: RB,  slot: RB }
  - { name: "Terry McLaurin",        team: WSH, position: WR,  slot: WR }
  - { name: "A.J. Brown",            team: PHI, position: WR,  slot: WR }
  - { name: "George Kittle",         team: SF,  position: TE,  slot: TE }
  - { name: "Jahmyr Gibbs",          team: DET, position: RB,  slot: FLEX }
  - { name: "Christian McCaffrey",   team: SF,  position: RB,  slot: FLEX }
  - { name: "San Francisco 49ers",   team: SF,  position: DST, slot: DST }
  - { name: "Brandon Aubrey",        team: DAL, position: K,   slot: K }
  - { name: "Jaylen Warren",         team: PIT, position: RB,  slot: BENCH }
  - { name: "Rome Odunze",           team: CHI, position: WR,  slot: BENCH }
  - { name: "Tyjae Spears",          team: TEN, position: RB,  slot: BENCH }
  - { name: "Chuba Hubbard",         team: CAR, position: RB,  slot: BENCH }

watch_teams: []        # empty => derived from roster teams

notify:
  provider: stub       # stub | ntfy | pushover | discord | slack
  ntfy_server: https://ntfy.sh
  ntfy_topic: null     # or set NTFY_TOPIC in the env
  priority: default

politeness:
  user_agent: "roster-health-monitor/0.1 (+https://github.com/herggie/ken; personal use)"
  default_ttl_minutes: 180
  default_min_interval_seconds: 2.0
  cache_dir: .cache
  state_dir: .state

sources:
  sleeper:       { enabled: true,  ttl_minutes: 1440, min_interval_seconds: 2.0 }
  espn_public:   { enabled: false }
  nfl_official:  { enabled: false }
  nfl_inactives: { enabled: false }
  team_sites:    { enabled: false }
  news_rss:      { enabled: false }
